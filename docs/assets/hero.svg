<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-labelledby="t d">
  <title id="t">Project Second Brain</title>
  <desc id="d">A knowledge-base template for AI coding agents: five layers from inbox to artifacts, every answer grounded, cited and evidence-ranked. Works with Claude Code and GitHub Copilot.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F7CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity=".40"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }
      .kick { font-size: 17px; letter-spacing: 5px; fill: #2EC4B6; }
      .h1 { font-size: 60px; font-weight: 800; fill: #FFFFFF; }
      .sub { font-size: 21px; fill: #CFC9D3; }
      .pill { font-size: 15px; fill: #ECE6EF; }
      .lab { font-size: 15px; letter-spacing: 3px; fill: #ECE6EF; }
      .labs { font-size: 13px; fill: #8E8794; }
      .plane { animation: glow 6s ease-in-out infinite; }
      .p2 { animation-delay: 1.2s } .p3 { animation-delay: 2.4s } .p4 { animation-delay: 3.6s } .p5 { animation-delay: 4.8s }
      @keyframes glow { 0%, 100% { opacity: .85 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1400" height="600" rx="28" fill="#0E0D12"/>
  <rect width="1400" height="600" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="250" r="330" fill="url(#glowA)"/>
  <circle cx="880" cy="470" r="260" fill="url(#glowB)"/>

  <!-- copy -->
  <text x="72" y="104" class="sans kick">PROJECT SECOND BRAIN</text>
  <text x="68" y="182" class="sans h1">Every answer</text>
  <text x="68" y="252" class="sans h1">grounded, cited,</text>
  <text x="68" y="322" class="sans h1" fill="url(#grad)" style="fill:url(#grad)">evidence-ranked.</text>
  <text x="72" y="380" class="sans sub">A knowledge-base template for AI coding agents,</text>
  <text x="72" y="410" class="sans sub">built over the documents your project already has.</text>

  <g class="sans pill">
    <rect x="72" y="452" width="148" height="40" rx="20" fill="#4F7CFF" fill-opacity=".22" stroke="#4F7CFF"/>
    <text x="146" y="478" text-anchor="middle">Claude Code</text>
    <rect x="232" y="452" width="168" height="40" rx="20" fill="#4F7CFF" fill-opacity=".22" stroke="#4F7CFF"/>
    <text x="316" y="478" text-anchor="middle">GitHub Copilot</text>
    <rect x="412" y="452" width="160" height="40" rx="20" fill="#2EC4B6" fill-opacity=".14" stroke="#2EC4B6"/>
    <text x="492" y="478" text-anchor="middle">DuckDB · Docling</text>
    <rect x="584" y="452" width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".35"/>
    <text x="634" y="478" text-anchor="middle">MIT</text>
  </g>

  <!-- layer stack: isometric planes, bottom to top -->
  <g>
    <polygon class="plane p1" points="1000,370 1190,465 1000,560 810,465" fill="#786E78" fill-opacity=".25" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>
    <polygon class="plane p2" points="1000,295 1190,390 1000,485 810,390" fill="#2EC4B6" fill-opacity=".16" stroke="#2EC4B6" stroke-opacity=".6" stroke-width="2"/>
    <polygon class="plane p3" points="1000,220 1190,315 1000,410 810,315" fill="#9B78FF" fill-opacity=".20" stroke="#9B78FF" stroke-opacity=".7" stroke-width="2"/>
    <polygon class="plane p4" points="1000,145 1190,240 1000,335 810,240" fill="#4F7CFF" fill-opacity=".32" stroke="#4F7CFF" stroke-width="2"/>
    <polygon class="plane p5" points="1000,70 1190,165 1000,260 810,165" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <g class="sans">
    <line x1="1196" y1="165" x2="1226" y2="165" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>
    <text x="1234" y="162" class="lab">ARTIFACTS</text><text x="1234" y="180" class="labs">designs, registers</text>
    <line x1="1196" y1="240" x2="1226" y2="240" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>
    <text x="1234" y="237" class="lab">METADATA</text><text x="1234" y="255" class="labs">SQL + graph</text>
    <line x1="1196" y1="315" x2="1226" y2="315" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>
    <text x="1234" y="312" class="lab">KNOWLEDGE</text><text x="1234" y="330" class="labs">cited notes</text>
    <line x1="1196" y1="390" x2="1226" y2="390" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>
    <text x="1234" y="387" class="lab">SOURCE</text><text x="1234" y="405" class="labs">immutable originals</text>
    <line x1="1196" y1="465" x2="1226" y2="465" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2"/>
    <text x="1234" y="462" class="lab">INBOX</text><text x="1234" y="480" class="labs">drop zone</text>
  </g>
</svg>
