[project]
name = "project-second-brain"
version = "0.1.0"
description = "A project second brain for AI coding agents (Claude Code, GitHub Copilot): grounded, cited, evidence-ranked knowledge over heterogeneous project documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# Core: deterministic tabular engine, KB tooling, artifact builders.
dependencies = [
    "duckdb>=1.2",
    "pandas>=2.2",
    "tabulate>=0.9",      # DataFrame.to_markdown()
    "openpyxl>=3.1",      # .xlsx read/write, fully offline
    "python-pptx>=1.0",   # .pptx deliverables
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy: pulls PyTorch and downloads layout/table models on first run. Only to parse documents.
docs = ["docling>=2.0"]
# Unwraps OLE-embedded objects (legacy .xls/.doc inside Office files, Acrobat PDFs).
ole = ["olefile>=0.47"]
# Behind a TLS-intercepting proxy: use the OS trust store (set KB_USE_TRUSTSTORE=1).
tls = ["truststore>=0.10"]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
# The environment lives in ./.venv. Copy instead of hardlinking, so it also works when
# the project folder is inside a cloud-synced directory.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
